[project]
name = "matterlab-science-api"
version = "0.1.0"
description = "MatterLab scientific computation service boundary (uv-managed)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "openmm>=8.6.1",
    "pydantic>=2.10.0,<3.0.0",
    "rdkit>=2026.9.2",
    "uvicorn[standard]>=0.34.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "pytest>=8.3.0,<9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
